name: Provider Router CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x86_64, extension: sh}
          - {os: ubuntu-24.04-arm, platform: linux, arch: aarch64, extension: sh}
          - {os: macos-15-intel, platform: macos, arch: x86_64, extension: pkg}
          - {os: macos-latest, platform: macos, arch: aarch64, extension: pkg}
          - {os: windows-latest, platform: windows, arch: x86_64, extension: exe}
          - {os: windows-11-arm, platform: windows, arch: aarch64, extension: exe}
    runs-on: ${{ matrix.os }}
    env:
      INSTALLER: release/provider-router-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
      ROUTER_BINARY: target/release/provider-router${{ matrix.platform == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked
      - name: Test manual-install builds
        if: github.event_name == 'workflow_dispatch'
        run: cargo +stable test --locked --features manual-installers
      - run: cargo +stable build --locked --release --features manual-installers
      - name: Verify release payload
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          host=$(rustc +stable -vV | sed -n 's/^host: //p')
          [[ "$host" == "$EXPECTED_ARCH-"* ]]
          version=$("$ROUTER_BINARY" --version)
          version=${version%$'\r'}
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v${version#provider-router }" ]]; then
            echo 'The release tag must match the version in Cargo.toml.' >&2
            exit 1
          fi

      - name: Build Linux installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'linux'
        run: bash installers/unix/build-linux.sh "$ROUTER_BINARY" "$INSTALLER"

      - name: Build macOS installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'macos'
        run: bash installers/unix/build-macos.sh "$ROUTER_BINARY" "$INSTALLER"

      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows'
        shell: pwsh
        run: ./installers/windows/build.ps1 -Binary $env:ROUTER_BINARY -Output $env:INSTALLER

      - name: Smoke test Linux installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'linux'
        shell: bash
        run: |
          installer_home=$(mktemp -d)
          trap 'rm -rf "$installer_home"' EXIT
          HOME="$installer_home" XDG_CONFIG_HOME="$installer_home/.config" bash "$INSTALLER"
          [[ $("$installer_home/.local/bin/provider-router" --version) == $("$ROUTER_BINARY" --version) ]]

      - name: Smoke test macOS installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'macos'
        shell: bash
        run: |
          installer -pkg "$INSTALLER" -target CurrentUserHomeDirectory
          test -x "$HOME/Applications/Provider Router.command"
          [[ $("$HOME/.local/bin/provider-router" --version) == $("$ROUTER_BINARY" --version) ]]

      - name: Smoke test Windows installer
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath (Resolve-Path $env:INSTALLER).Path `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\ProviderRouter\provider-router.exe'
          $version = & $installed --version
          if ($LASTEXITCODE -ne 0 -or $version -ne (& $env:ROUTER_BINARY --version)) {
            throw 'The installed executable does not match the release payload.'
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Provider Router.lnk'
          if (!(Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw 'Start menu shortcut is missing.' }

      - name: Upload installer candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-router-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.INSTALLER }}
          if-no-files-found: error
